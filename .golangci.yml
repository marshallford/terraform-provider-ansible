version: "2"
linters:
  default: all
  disable:
  - depguard
  - exhaustruct
  - exhaustruct_v5
  - funlen
  - goconst
  - godox
  - lll
  - noinlineerr
  - recvcheck
  - revive
  - testpackage
  - wsl
  - wsl_v5
  settings:
    perfsprint:
      string-format: false
    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
    wrapcheck:
      ignore-package-globs:
      - github.com/marshallford/terraform-provider-ansible/*
